<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه شیمی مجازی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #eee;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #4fc3f7;
    margin-bottom: 25px;
    text-shadow: 0 0 10px rgba(79,195,247,0.5);
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 12px 28px;
    background: #0f3460;
    color: #eee;
    border: 2px solid #4fc3f7;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s;
  }

  .tab-btn:hover { background: #16498a; }
  .tab-btn.active {
    background: #4fc3f7;
    color: #0f0f1e;
    font-weight: bold;
    box-shadow: 0 0 15px #4fc3f7;
  }

  .section { display: none; }
  .section.active { display: block; animation: fadeIn 0.4s; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

  /* ---------- جدول تناوبی ---------- */
  .periodic-wrapper {
    overflow-x: auto;
    padding: 10px;
  }

  .periodic-table {
    display: grid;
    grid-template-columns: repeat(18, 55px);
    grid-template-rows: repeat(7, 55px);
    gap: 3px;
    justify-content: center;
    min-width: 1050px;
  }

  .element {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid rgba(255,255,255,0.2);
    position: relative;
    padding: 2px;
    line-height: 1.1;
  }

  .element:hover {
    transform: scale(1.15);
    z-index: 10;
    box-shadow: 0 0 15px currentColor;
  }

  .element .num { font-size: 9px; opacity: 0.8; }
  .element .sym { font-size: 15px; font-weight: bold; }
  .element .name { font-size: 8px; opacity: 0.85; }

  /* رنگ دسته‌ها */
  .alkali     { background:#ff6b6b; color:#fff; }
  .alkaline   { background:#ffa94d; color:#000; }
  .transition { background:#ffd43b; color:#000; }
  .post-trans { background:#69db7c; color:#000; }
  .metalloid  { background:#38d9a9; color:#000; }
  .nonmetal   { background:#4dabf7; color:#fff; }
  .halogen    { background:#b197fc; color:#fff; }
  .noble      { background:#f783ac; color:#fff; }
  .lanthanide { background:#f06595; color:#fff; }
  .actinide   { background:#c2255c; color:#fff; }
  .unknown    { background:#868e96; color:#fff; }

  .empty { visibility: hidden; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
    font-size: 13px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-color {
    width: 18px; height: 18px; border-radius: 4px;
  }

  /* ---------- آزمایشگاه ---------- */
  .lab-container {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
  }

  .beaker-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 25px;
  }

  .beaker {
    position: relative;
    width: 200px;
    height: 240px;
    margin: 20px auto;
  }

  .beaker-glass {
    position: absolute;
    bottom: 0;
    width: 200px;
    height: 220px;
    border: 4px solid #a8dadc;
    border-top: none;
    border-radius: 0 0 20px 20px;
    background: rgba(255,255,255,0.05);
    box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
    overflow: hidden;
  }

  .water {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 70%;
    background: linear-gradient(to bottom, #4fc3f7, #0288d1);
    transition: background 0.8s ease, height 0.5s ease;
    border-radius: 0 0 16px 16px;
  }

  .water::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 0;
    width: 100%;
    height: 16px;
    background: inherit;
    border-radius: 50%;
    opacity: 0.7;
  }

  .bubbles {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    animation: rise 2s infinite;
  }

  @keyframes rise {
    0% { transform: translateY(0); opacity: 0.8; }
    100% { transform: translateY(-180px); opacity: 0; }
  }

  .result-text {
    margin-top: 15px;
    font-size: 18px;
    min-height: 30px;
    color: #4fc3f7;
    font-weight: bold;
  }

  .compounds {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    max-width: 700px;
    margin: 0 auto;
  }

  .compound-btn {
    padding: 15px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: all 0.3s;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .compound-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  .reset-btn {
    margin-top: 20px;
    padding: 10px 30px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 15px;
  }
  .reset-btn:hover { background: #c0392b; }

  /* مودال اطلاعات عنصر */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #1e2a4a;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid #4fc3f7;
    max-width: 400px;
    width: 90%;
    text-align: center;
  }
  .modal-content h2 { color: #4fc3f7; margin-bottom: 15px; font-size: 28px; }
  .modal-content p { margin: 8px 0; font-size: 15px; }
  .close-btn {
    margin-top: 20px;
    padding: 8px 25px;
    background: #4fc3f7;
    color: #000;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>🧪 آزمایشگاه شیمی مجازی</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('periodic')">📊 جدول تناوبی</button>
  <button class="tab-btn" onclick="showTab('lab')">💧 آزمایشگاه انحلال</button>
</div>

<!-- ================== بخش جدول تناوبی ================== -->
<div id="periodic" class="section active">
  <div class="periodic-wrapper">
    <div class="periodic-table" id="periodicTable"></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<!-- ================== بخش آزمایشگاه ================== -->
<div id="lab" class="section">
  <div class="lab-container">
    <div class="beaker-area">
      <div class="beaker">
        <div class="beaker-glass">
          <div class="water" id="water"></div>
          <div class="bubbles" id="bubbles"></div>
        </div>
      </div>
      <div class="result-text" id="resultText">یک ترکیب را انتخاب کنید…</div>
    </div>

    <div class="compounds" id="compounds"></div>
    <button class="reset-btn" onclick="resetWater()">🔄 ریست کردن آب</button>
  </div>
</div>

<!-- مودال -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p id="modalInfo"></p>
    <button class="close-btn" onclick="closeModal()">بستن</button>
  </div>
</div>

    <p><strong>آرایش الکترونی:</strong> ${el.conf}</p>

}

function closeModal() {

function shade(hex, percent) {
  let num = parseInt(hex.replace('#',''),16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return '#' + ((r<<16) | (g<<8) | b).toString(16).padStart(6,'0');
}
